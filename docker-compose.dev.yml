# =============================================================================
# docker-compose.dev.yml — Development overrides
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml \
#     --env-file .env.dev up -d
#
# Then run the web app locally:
#   npm run web:dev
# =============================================================================

services:
  server:
    env_file:
      - apps/server/env/.env.development
    environment:
      # These override values from env_file
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/cloud-drive
      - NAS_STORAGE_PATH=/storage
    depends_on:
      - mongo
    volumes:
      - ./apps/server:/app/apps/server
      - ./shared:/app/shared
      - ${NAS_HOST_PATH}:/storage
      - /app/apps/server/node_modules
    command: ["node", "--watch", "bin/www.js"]

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

 # Visual MongoDB browser — http://localhost:8081
  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
