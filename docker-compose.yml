# =============================================================================
# docker-compose.yml — Shared base (never run this alone)
#
# Dev:  docker-compose -f docker-compose.yml -f docker-compose.dev.yml \
#         --env-file .env.dev up
#
# Prod: docker-compose -f docker-compose.yml -f docker-compose.prod.yml \
#         --env-file .env.prod up --build -d
# =============================================================================

x-server-build: &server-build
  context: .
  dockerfile: apps/server/Dockerfile
  args:
    # Pinned to Debian slim — smaller image (~300MB saved) while keeping glibc
    # required by canvas, @tensorflow/tfjs-node, sharp, heic-convert.
    # Update patch version here when upgrading Node.
    NODE_VERSION: "22-bookworm-slim"
    SERVER_PORT: "9000"

services:
  server:
    build:
      <<: *server-build
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [app-net]

# Explicit named network shared by all services across dev and prod overlays.
# Keeps inter-container DNS predictable and makes future services (e.g. Redis)
# easy to add without hunting for the auto-generated default network name.
networks:
  app-net:
    driver: bridge

