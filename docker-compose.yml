# =============================================================================
# docker-compose.yml — Shared base (never run this alone)
#
# Dev:  docker-compose -f docker-compose.yml -f docker-compose.dev.yml \
#         --env-file .env.dev up
#
# Prod: docker-compose -f docker-compose.yml -f docker-compose.prod.yml \
#         --env-file .env.prod up --build -d
# =============================================================================

x-server-build: &server-build
  context: .
  dockerfile: apps/server/Dockerfile
  args:
    NODE_VERSION: "22"
    SERVER_PORT: "9000"

x-web-build: &web-build
  context: .
  dockerfile: apps/web/Dockerfile
  args:
    NODE_VERSION: "22-alpine"
    NGINX_VERSION: "alpine"

services:
  server:
    build:
      <<: *server-build
    ports:
      - "${SERVER_PORT:-9000}:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

