server {
    listen 80;
    server_name _;
    # Redirect all HTTP traffic to HTTPS
    return 301 https://localhost$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow chunked uploads (multer limits to 5GB overall, this limits per chunk)
    client_max_body_size 20m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── Security Headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    # 5-minute HSTS — safe for LAN/dev where cert may be regenerated.
    # Increase to max-age=31536000 only with a stable, externally-trusted certificate.
    add_header Strict-Transport-Security "max-age=300" always;

    # ── Static SPA ─────────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Let React Router handle client-side routes
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → server container ───────────────────────────────────────────
    location /api/v1 {
        proxy_pass http://server:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Socket.IO WebSocket proxy ───────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://server:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_cache_bypass          $http_upgrade;
    }
}
