# =============================================================================
# docker-compose.prod.yml — Production overrides
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up --build -d
# =============================================================================

services:
  server:
    env_file:
      - apps/server/env/.env.production
    environment:
      - NODE_ENV=production
      - NAS_STORAGE_PATH=/storage
    volumes:
      # :? guard — Docker Compose fails fast with a clear error if this is unset
      # rather than silently mounting the host root filesystem (/) into the container.
      - ${NAS_HOST_PATH:?NAS_HOST_PATH must be set in .env.prod}:/storage
    networks: [app-net]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_VERSION: "22-alpine"
        NGINX_VERSION: "alpine"
        # Controls nginx server_name, the HTTP redirect target, and the cert CN.
        # Set SERVER_NAME in .env.prod (e.g. raspberrypi.local).
        SERVER_NAME: "${SERVER_NAME:-localhost}"
        # 31536000 (1 year) default — requires a stable cert in prod.
        # Override to 300 in .env.prod if using a self-signed cert that may be rebuilt.
        HSTS_MAX_AGE: "${HSTS_MAX_AGE:-31536000}"
    ports:
      # WEB_PORT and HTTPS_PORT are documented in .env.prod.example.
      - "${WEB_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost:443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [app-net]

# app-net is declared in docker-compose.yml (base) — listed here so prod services
# can join it without re-declaring the driver.
networks:
  app-net:
