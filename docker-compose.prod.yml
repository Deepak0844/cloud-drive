# =============================================================================
# docker-compose.prod.yml — Production overrides
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.prod up --build -d
# =============================================================================

services:
  server:
    env_file:
      - apps/server/env/.env.production
    environment:
      - NODE_ENV=production
      - NAS_STORAGE_PATH=/storage
    volumes:
      # :? guard — Docker Compose fails fast with a clear error if this is unset
      # rather than silently mounting the host root filesystem (/) into the container.
      - ${NAS_HOST_PATH:?NAS_HOST_PATH must be set in .env.prod}:/storage
    networks: [app-net]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_VERSION: "22-alpine"
        NGINX_VERSION: "alpine"
    ports:
      # WEB_PORT and HTTPS_PORT are documented in .env.prod.
      - "${WEB_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks: [app-net]

# app-net is declared in docker-compose.yml (base) — listed here so prod services
# can join it without re-declaring the driver.
networks:
  app-net:
